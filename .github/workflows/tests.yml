name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # CPU wheels of the pinned versions keep the install small; the tests need no GPU and no SurgVU data.
      - run: pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt pyflakes==3.2.0
      - run: python -m pyflakes src tests ros2
      - run: python -m pytest
